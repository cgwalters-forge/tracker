# Bounds for dispatch.yml's implement runs on the midstream forks, the
# repositories with the `bot-midstream` topic (#336): dispatch.toml's bounds
# without `ready_when_complete`, so apply opens every pull request there as
# a draft. A ready one was merged into a fork's main by mistake, putting it
# ahead of upstream (#290); their main tracks upstream, and the operator
# promotes work upstream instead. cgwalters-review skips drafts, so these
# get no automatic review; `/review` still works. The pass follows them for
# fix rounds, and `pr.noMerge` in pass.json keeps it from merging there.
# Nothing here reads the topic: these lists are what decides, so a fork
# that gets the topic must be added here before it is dispatched to.
# The profile job of dispatch.yml picks this file for a target listed here,
# so a repository belongs here or in dispatch.toml, never both; the same
# for midstream-fix.toml and fix.toml. Protected files stay blocked except
# for the workflow admission below.
hosts = ["github.com"]
repos = ["cgwalters-forge/composefs-rs", "cgwalters-forge/bootc", "cgwalters-forge/bcvk", "cgwalters-forge/rpm-ostree", "cgwalters-forge/anaconda", "cgwalters-forge/gh-agentic-workflows"]
bases = ["main"]
max_outputs = 3
max_patch_bytes = 1048576
max_patch_files = 50
# A misled run must not change the caller's execution destinations.
protected = [".github/agentic-job/runner-profiles.json"]

[github.outputs]
create_pull_request = { max = 1 }
add_comment = { max = 1 }
noop = { max = 1 }
missing_tool = { max = 1 }
missing_data = { max = 1 }

# Runs may edit `.github/`, workflows included, in every midstream fork, so
# CI fixes there don't stall (operator, tracker#1239). Nothing lands in a
# fork's main this way: apply opens drafts only and pr.noMerge keeps the pass
# from merging, so an edit reaches anything only when the operator's
# promotion takes it upstream, where upstream review applies.
[unprotected_files]
repos = ["cgwalters-forge/composefs-rs", "cgwalters-forge/bootc", "cgwalters-forge/bcvk", "cgwalters-forge/rpm-ostree", "cgwalters-forge/anaconda", "cgwalters-forge/gh-agentic-workflows"]
dot_folders = [".github"]
