# Moves the commit pins of third-party actions daily (#544). Our own
# workflows and actions are followed at main and are not pinned. Also
# moves the locked crates of the config test.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    # A release has a week to be found compromised and pulled before a pin
    # moves to it.
    cooldown:
      default-days: 7
  # The config test crate's two dev-dependencies, in one pull request.
  - package-ecosystem: cargo
    directory: /.github/agentic-job/config-test
    schedule:
      interval: daily
    groups:
      config-test:
        patterns: ["*"]
    cooldown:
      default-days: 7
