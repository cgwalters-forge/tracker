# Keeps every midstream fork's default branch current with its upstream
# (operator, 2026-11-12 on ostree#7): stale fork branches pulled upstream
# history into drafts and held promotion. The org ruleset on fork default
# branches refuses direct pushes, so this syncs as the org's GitHub App.
# The App's bypass must sit on a ruleset that targets only the forks (custom
# property origin=fork), never on the org-wide one that also protects the
# harness repositories; it stays off until vars.MIDSTREAM_SYNC is apply. GitHub's sync-fork
# endpoint fast-forwards, or merges when the fork carries its own
# commits (the midstream marker), and refuses on conflict.
name: midstream-sync
on:
  schedule:
    - cron: '41 */6 * * *'
  workflow_dispatch:
permissions: {}
concurrency:
  group: midstream-sync
  cancel-in-progress: false
jobs:
  sync:
    if: ${{ vars.MIDSTREAM_SYNC == 'apply' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    # The key is a secret of this environment only, which deploys only from main.
    environment: github-app
    permissions: {}
    steps:
      # The forks to sync come from repository metadata (fork with the
      # bot-midstream topic), never from a list kept here.
      - id: forks
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          repos=$(gh api --paginate "orgs/$OWNER/repos?type=forks&per_page=100" --jq '.[] | select(.archived | not) | select(.topics | index("bot-midstream")) | .name' | paste -sd, -)
          echo "repos=$repos" >> "$GITHUB_OUTPUT"
      # Pinned: this step receives the App's private key.
      - id: app
        uses: cgwalters-forge/actions/app-token@59814e7302830812ae069dc4a31fe0714bf6a350 # main
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.forks.outputs.repos }}
          permission-contents: write
          # An upstream change to a workflow file can't sync without it.
          permission-workflows: write
      # Each repository's result is one line; a conflict is reported, not forced.
      - name: Sync each fork
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPOS: ${{ steps.forks.outputs.repos }}
          OWNER: ${{ github.repository_owner }}
        run: |
          for repo in ${REPOS//,/ }; do
            branch=$(gh api "repos/$OWNER/$repo" --jq .default_branch)
            gh api -X POST "repos/$OWNER/$repo/merge-upstream" -f branch="$branch" --jq "\"$repo: \(.merge_type) \(.message)\"" || echo "::warning::$repo did not sync"
          done
